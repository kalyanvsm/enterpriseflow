name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enterpriseflow_test
          POSTGRES_USER: enterpriseflow
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterpriseflow -d enterpriseflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: enterpriseflow
      POSTGRES_TEST_DB: enterpriseflow_test
      POSTGRES_USER: enterpriseflow
      POSTGRES_PASSWORD: ci_test_password
      JWT_SECRET_KEY: ci-only-secret-key-for-tests-not-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install --group dev

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -q
